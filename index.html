<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOT app preview</title>
<style>
:root{--accent:#1F4E89;--ink:#172033;--muted:#5B6476;--line:#D7DEE8;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(ellipse at top,#EAF1FA 0%,#DCE4EE 60%,#CDD7E3 100%);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;}
.bar{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap;}
.bar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.06em;}
.bar .brand small{font-weight:600;letter-spacing:0;color:var(--muted);font-size:13px;}
.sp{flex:1;}
.tg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 1px 4px rgba(15,42,77,.08);}
.tg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.tg button svg{width:15px;height:15px;}
.tg button.on{background:var(--accent);color:#fff;}
.tg[hidden]{display:none;}
.stage{flex:1;display:grid;place-items:center;min-height:0;padding:4px 16px 14px;}
.box{position:relative;}
.dev{position:absolute;left:0;top:0;transform-origin:0 0;background:#0E1522;border-radius:58px;padding:16px 16px 36px;box-shadow:0 30px 70px rgba(15,42,77,.35),inset 0 0 0 2px #2A3446;}
.dev.tab{border-radius:40px;padding:22px 22px 40px;}
.screen{position:relative;overflow:hidden;border-radius:44px;background:#fff;}
.dev.tab .screen{border-radius:20px;}
.dev iframe{display:block;border:0;background:#fff;width:100%;height:100%;}
.pill{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);width:140px;height:16px;border:0;background:transparent;cursor:pointer;padding:0;}
.pill::after{content:"";display:block;margin:5px auto 0;width:130px;height:6px;border-radius:999px;background:#C9D2DE;}
.pill:hover::after{background:#fff;}
/* device home screen */
.homescr{position:absolute;inset:0;z-index:5;background:linear-gradient(160deg,#1F4E89 0%,#2E6AA8 38%,#7FA6D9 72%,#DCE7F5 100%);display:flex;flex-direction:column;color:#fff;transition:opacity .35s ease,transform .35s ease;}
.homescr.gone{opacity:0;transform:scale(1.08);pointer-events:none;}
.clock{padding:70px 0 0;text-align:center;}
.dev.tab .clock{padding-top:56px;}
.clock b{display:block;font-size:76px;font-weight:300;letter-spacing:-.02em;line-height:1;}
.clock span{display:block;font-size:17px;font-weight:600;margin-top:8px;opacity:.9;}
.grid{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;row-gap:26px;padding:56px 30px 0;}
.dev.tab .grid{grid-template-columns:repeat(6,76px);padding:64px 90px 0;row-gap:34px;}
.ic{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
.dev.tab .ic{width:76px;height:76px;border-radius:19px;}
.appic{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0;cursor:pointer;color:#fff;font:inherit;font-size:12.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.appic .ic{background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,30,60,.25);}
.appic:hover .ic{transform:translateY(-2px);}
.appic:focus-visible .ic{outline:3px solid #fff;outline-offset:3px;}
.dock{margin:auto 14px 14px;padding:14px 18px;border-radius:30px;background:rgba(255,255,255,.22);display:flex;justify-content:space-between;}
.dev.tab .dock{margin:auto auto 22px;gap:28px;padding:16px 28px;}
.hint{text-align:center;font-size:13px;font-weight:600;margin-top:22px;opacity:.92;}
.splash{position:absolute;inset:0;z-index:6;background:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.splash.on{opacity:1;}
.splash .in{text-align:center;transform:scale(.9);transition:transform .5s ease;}
.splash.on .in{transform:scale(1);}
.splash b{display:block;font-size:30px;letter-spacing:.1em;color:#1F4E89;margin-top:14px;}
.splash span{display:block;font-size:14px;color:#5B6476;margin-top:6px;font-weight:600;}
.note{text-align:center;font-size:12px;color:var(--muted);padding:0 0 10px;}
</style>
</head>

    var key = dev === 'phone' ? 'phone' : or, w = SIZES[key][0], h = SIZES[key][1];
    var d = document.getElementById('dev'), pad = dev === 'phone' ? 16 : 22, padB = dev === 'phone' ? 36 : 40;
    var was = d.className;

    var sc = document.getElementById('screen'); sc.style.width = w + 'px'; sc.style.height = h + 'px';

    var availH = window.innerHeight - document.querySelector('.bar').offsetHeight - 50, availW = window.innerWidth - 40;
    var s = Math.min(1, availH / H, availW / W);
    d.style.transform = 'scale(' + s + ')';
    var bx = document.getElementById('box'); bx.style.width = (W * s) + 'px'; bx.style.height = (H * s) + 'px';

  /* device home screen, app icon and splash */
